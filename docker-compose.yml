version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shadow_postgres
    restart: always
    environment:
      POSTGRES_DB: shadow_blockplanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ShadowPL
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shadow_blockplanner"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shadow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shadow_api
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shadow_blockplanner
      DB_USER: postgres
      DB_PASSWORD: ShadowPL
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "ai_engine.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shadow_worker
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: shadow_blockplanner
      DB_USER: postgres
      DB_PASSWORD: ShadowPL
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "ai_engine/run_worker.py"]

volumes:
  postgres_data:
  redis_data: